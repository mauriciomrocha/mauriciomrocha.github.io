<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maurício Rocha</title>
<meta name="description" content="Projetos de Maurício Rocha: Viola em Cores, acordes da viola caipira com as notas em cores.">
<meta name="color-scheme" content="light dark">
<style>
:root { --fundo:#FAFAF7; --tinta:#1D1D1F; --suave:#595959; --linha:#DADAD5; --link:#0B57D0; }
@media (prefers-color-scheme: dark) { :root { --fundo:#121316; --tinta:#ECECEC; --suave:#B4B4B4; --linha:#3A3D44; --link:#8AB4F8; } }
body { margin:0; background:var(--fundo); color:var(--tinta); font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
main { max-width:720px; margin:0 auto; padding:48px 16px; }
a { color:var(--link); }
.projeto { border:1px solid var(--linha); border-radius:14px; padding:16px 20px; margin-top:20px; }
.projeto h2 { margin:0 0 6px; font-size:1.25rem; }
.projeto p { margin:0 0 8px; color:var(--suave); }
</style>
</head>
<body>
<main>
<h1>Maurício Rocha</h1>
<section class="projeto">
<h2><a href="https://violaemcores.com.br/">Viola em Cores</a></h2>
<p>Acordes da viola caipira no cebolão em Mi, com cada nota numa cor: dicionário de acordes, formas móveis
pelo braço e o campo harmônico dos 24 tons com progressões.</p>
</section>
</main>
</body>
</html>
