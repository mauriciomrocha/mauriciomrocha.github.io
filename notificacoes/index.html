<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Política de Privacidade — NotiVault</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-soft: #f1f5f9;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --primary: #3730a3;
      --primary-soft: #e0e7ff;
      --primary-on-soft: #1e1b4b;
      --emerald: #059669;
      --emerald-bright: #34d399;
      --emerald-soft: #d1fae5;
      --emerald-on-soft: #064e3b;
      --hero-start: #090d16;
      --hero-end: #3730a3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --surface: #111827;
        --surface-soft: #1e293b;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --border: #1e293b;
        --primary: #a5b4fc;
        --primary-soft: #312e81;
        --primary-on-soft: #e0e7ff;
        --emerald: #34d399;
        --emerald-soft: #065f46;
        --emerald-on-soft: #d1fae5;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    header.hero {
      background: linear-gradient(135deg, var(--hero-start) 0%, var(--hero-end) 100%);
      color: #ffffff;
      padding: 2.5rem 1.25rem 3rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.01em;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #3730a3;
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .lang-switcher {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 0.25rem;
      gap: 0.25rem;
    }

    .lang-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #e0e7ff;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .lang-btn.active {
      background: #34d399;
      color: #022c22;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(52, 211, 153, 0.18);
      border: 1px solid rgba(52, 211, 153, 0.45);
      color: #a7f3d0;
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    .hero h1 {
      font-size: clamp(1.75rem, 3.8vw, 2.35rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 0.65rem;
    }

    .hero-subtitle {
      color: #e0e7ff;
      font-size: 1.05rem;
      max-width: 660px;
    }

    main {
      padding: 2rem 1.25rem 4rem;
    }

    .highlight-banner {
      background-color: var(--emerald-soft);
      color: var(--emerald-on-soft);
      border: 1px solid rgba(5, 150, 105, 0.25);
      border-radius: 14px;
      padding: 1.25rem 1.4rem;
      margin-top: -2.25rem;
      margin-bottom: 1.75rem;
      box-shadow: 0 10px 25px -10px rgba(9, 13, 22, 0.25);
    }

    .highlight-banner h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.15rem;
    }

    .card h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }

    .card p + p {
      margin-top: 0.75rem;
    }

    .card ul {
      margin-top: 0.75rem;
      padding-left: 1.25rem;
    }

    .card li {
      margin-bottom: 0.45rem;
      color: var(--text);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.85rem;
      margin-top: 0.75rem;
    }

    .meta-item {
      background: var(--surface-soft);
      border-radius: 10px;
      padding: 0.85rem 1rem;
    }

    .meta-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .meta-value {
      font-weight: 600;
      font-size: 0.95rem;
      word-break: break-word;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.875em;
      background: var(--surface-soft);
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
    }

    a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="container">
      <div class="topbar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 108 108" fill="none">
              <path d="M51,24 C51,21.8 52.8,20 55,20 C57.2,20 59,21.8 59,24 L59,27 L51,27 Z" fill="#FFFFFF" />
              <path d="M55,27 C43,27 33,38 33,52 L33,65 L77,65 L77,52 C77,38 67,27 55,27 Z" fill="#FFFFFF" />
              <path d="M29,65 L81,65 L81,69 L29,69 Z" fill="#FFFFFF" />
              <circle cx="55" cy="75" r="6" fill="#FFFFFF" />
              <path d="M65,57 L83,57 L83,70 C83,76.6 74,80.5 74,80.5 C74,80.5 65,76.6 65,70 Z" fill="#34D399" />
              <path d="M69,68 L72.5,71.5 L79.5,63" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <span>NotiVault</span>
        </div>

        <nav class="lang-switcher" aria-label="Language selector">
          <button type="button" class="lang-btn active" data-lang="pt" onclick="setLang('pt')">Português</button>
          <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
          <button type="button" class="lang-btn" data-lang="es" onclick="setLang('es')">Español</button>
        </nav>
      </div>

      <div class="hero-badge" id="hero-badge">🛡️ 100% Offline • Sem Internet</div>
      <h1 id="hero-title">Política de Privacidade</h1>
      <p class="hero-subtitle" id="hero-subtitle"></p>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="highlight-banner" aria-live="polite">
        <h2 id="banner-title"></h2>
        <p id="banner-body"></p>
      </section>

      <section class="card">
        <h2 id="s1-title"></h2>
        <p id="s1-body"></p>
        <div class="meta-grid">
          <div class="meta-item">
            <span class="meta-label" id="meta-app-label"></span>
            <span class="meta-value" id="meta-app-value"></span>
          </div>
          <div class="meta-item">
            <span class="meta-label" id="meta-dev-label"></span>
            <span class="meta-value">Maurício Matriz da Rocha</span>
          </div>
          <div class="meta-item">
            <span class="meta-label" id="meta-pkg-label"></span>
            <span class="meta-value"><code>io.github.mauriciomrocha.notilimpa</code></span>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 id="s2-title"></h2>
        <p id="s2-body1"></p>
        <p id="s2-body2"></p>
        <ul id="s2-list"></ul>
      </section>

      <section class="card">
        <h2 id="s3-title"></h2>
        <p id="s3-body1"></p>
        <p id="s3-body2"></p>
      </section>

      <section class="card">
        <h2 id="s4-title"></h2>
        <p id="s4-body1"></p>
        <p id="s4-body2"></p>
      </section>

      <section class="card">
        <h2 id="s5-title"></h2>
        <p id="s5-body"></p>
        <p style="margin-top: 0.75rem;">
          <strong id="s5-repo-label"></strong>
          <a href="https://github.com/mauriciomrocha/notificacoes" target="_blank" rel="noopener noreferrer">
            https://github.com/mauriciomrocha/notificacoes
          </a>
        </p>
      </section>

      <footer>
        <p id="footer-text"></p>
      </footer>
    </div>
  </main>

  <script>
    const TRANSLATIONS = {
      pt: {

          "Exibir sua linha do tempo pesquisável de notificações.",
          "Aplicar regras configuradas pelo usuário: Anti-Spam (Cooldown), Ocultar por Palavra-Chave e Alerta Prioritário.",
          "Ignorar automaticamente notificações do próprio aplicativo, eventos contínuos (ex.: reprodutores de mídia e downloads) e resumos de grupo."

        s3Title: "3. Ausência Total de Coleta e Rede",
        s3Body1: "O NotiVault não possui permissão de acesso à internet (INTERNET removida do AndroidManifest.xml). Não há SDKs de rastreamento, telemetria, analytics, publicidade ou contas de usuário.",
        s3Body2: "Nenhum conteúdo de notificação, identificador pessoal ou estatística de uso é coletado pelo desenvolvedor ou compartilhado com terceiros.",
        s4Title: "4. Retenção, Limpeza Automática e Controle do Usuário",
        s4Body1: "Você tem controle total sobre o histórico armazenado localmente. É possível configurar a limpeza automática periódica para 7, 15 ou 30 dias (padrão) nas Configurações do aplicativo.",
        s4Body2: "Você também pode apagar todo o histórico manualmente a qualquer momento com um toque, ou desativar o acesso a notificações nas configurações do sistema Android.",

        s5Body: "Em caso de dúvidas sobre esta Política de Privacidade, funcionamento das permissões ou relato de problemas, acesse o repositório oficial de suporte:",
        s5RepoLabel: "Suporte e código/documentação: ",
        footerText: "NotiVault: Histórico de Notificações • Desenvolvido por Maurício Matriz da Rocha • Última atualização: Novembro de 2026"
      },
      en: {
        htmlLang: "en",
        pageTitle: "Privacy Policy — NotiVault: Notification History",
        heroBadge: "🛡️ 100% Offline • No Internet Permission",
        heroTitle: "Privacy Policy",
        heroSubtitle: "Full transparency on how NotiVault keeps your notifications private and strictly inside your device.",
        bannerTitle: "Technical Guarantee: Nothing leaves your phone",
        bannerBody: "The android.permission.INTERNET permission has been explicitly removed from the application manifest (tools:node=\"remove\"). It is technically impossible for NotiVault to transmit, upload, or share any data with external servers.",
        s1Title: "1. Application Information",
        s1Body: "This Privacy Policy applies to the Android application NotiVault: Notification History, a 100% offline, free, ad-free, and login-free searchable notification history manager and smart filter.",
        metaAppLabel: "Application",
        metaAppValue: "NotiVault: Notification History",
        metaDevLabel: "Developer",
        metaPkgLabel: "Android Package",
        s2Title: "2. Use of NotificationListenerService",
        s2Body1: "To provide a searchable local notification timeline and run your custom filtering rules, the app uses Android's official NotificationListenerService API only after you explicitly grant permission in Android Settings.",
        s2Body2: "Captured notifications are processed and stored exclusively in a local on-device database (SQLite/Room) to:",
        s2List: [
          "Display your local, searchable notification history timeline.",
          "Apply user-defined rules: Anti-Spam (Cooldown), Hide by Keyword, and Priority Alert.",
          "Automatically ignore the app's own notifications, ongoing system events (such as media players or downloads), and group summaries."
        ],
        s3Title: "3. Zero Data Collection & Zero Network Access",
        s3Body1: "NotiVault has no internet permission (INTERNET is stripped from AndroidManifest.xml). There are no tracking SDKs, telemetry, analytics, advertisements, or user accounts.",
        s3Body2: "No notification content, personal identifier, or usage data is ever collected by the developer or shared with third parties.",
        s4Title: "4. Retention, Automatic Cleanup & User Control",
        s4Body1: "You retain full control over your locally stored history. Automatic background cleanup can be configured in Settings for 7, 15, or 30 days (default).",
        s4Body2: "You may also permanently erase your entire local history at any time with a single tap, or revoke notification access in Android system settings.",
        s5Title: "5. Support & Contact",
        s5Body: "If you have questions about this Privacy Policy, Android permissions, or need support, please visit the official project repository:",
        s5RepoLabel: "Support & repository: ",
        footerText: "NotiVault: Notification History • Developed by Maurício Matriz da Rocha • Last updated: November 2026"
      },
      es: {
        htmlLang: "es",
        pageTitle: "Política de Privacidad — NotiVault: Historial de Notificaciones",
        heroBadge: "🛡️ 100% Sin Conexión • Sin Permiso de Internet",
        heroTitle: "Política de Privacidad",
        heroSubtitle: "Transparencia total sobre cómo NotiVault protege tus notificaciones exclusivamente dentro de tu dispositivo.",
        bannerTitle: "Garantía Técnica: Ningún dato sale de tu teléfono",
        bannerBody: "El permiso android.permission.INTERNET fue eliminado explícitamente del manifiesto de la aplicación (tools:node=\"remove\"). Es técnicamente imposible que NotiVault envíe, suba o comparta datos con servidores externos.",

        s1Body: "Esta Política de Privacidad se aplica a la aplicación Android NotiVault: Historial de Notificaciones, un gestor de historial con búsqueda y filtro inteligente de notificaciones 100% sin conexión, gratuito, sin anuncios y sin inicio de sesión.",

        metaAppValue: "NotiVault: Historial de Notificaciones",
        metaDevLabel: "Desarrollador",
        metaPkgLabel: "Paquete Android",
        s2Title: "2. Uso de NotificationListenerService",
        s2Body1: "Para ofrecer un historial local con búsqueda y aplicar tus reglas personalizadas, la aplicación utiliza la API oficial NotificationListenerService únicamente tras tu autorización explícita en los Ajustes de Android.",

        s2List: [
          "Mostrar tu línea de tiempo local y buscable de notificaciones.",
          "Aplicar reglas configuradas por el usuario: Antispam (Cooldown), Ocultar por Palabra Clave y Alerta Prioritaria.",
          "Ignorar automáticamente notificaciones propias de la app, eventos continuos (reproductores multimedia, descargas) y resúmenes de grupo."
        ],
        s3Title: "3. Cero Recopilación de Datos y Cero Red",
        s3Body1: "NotiVault no cuenta con permiso de acceso a internet (INTERNET eliminado de AndroidManifest.xml). No incluye SDKs de rastreo, telemetría, analítica, publicidad ni cuentas de usuario.",

        s4Title: "4. Retención, Limpieza Automática y Control del Usuario",
        s4Body1: "Tienes control total sobre tu historial local. Puedes configurar la limpieza automática periódica a 7, 15 o 30 días (predeterminado) desde los Ajustes de la aplicación.",

        s5Title: "5. Soporte y Contacto",
        s5Body: "Si tienes dudas sobre esta Política de Privacidad, los permisos de Android o necesitas soporte, visita el repositorio oficial del proyecto:",

        footerText: "NotiVault: Historial de Notificaciones • Desarrollado por Maurício Matriz da Rocha • Última actualización: Noviembre de 2026"
      }
    };

    function setLang(lang) {
      const t = TRANSLATIONS[lang] || TRANSLATIONS.pt;
      document.documentElement.lang = t.htmlLang;
      document.title = t.pageTitle;

      document.getElementById("hero-badge").textContent = t.heroBadge;
      document.getElementById("hero-title").textContent = t.heroTitle;
      document.getElementById("hero-subtitle").textContent = t.heroSubtitle;
      document.getElementById("banner-title").textContent = t.bannerTitle;
      document.getElementById("banner-body").textContent = t.bannerBody;

      document.getElementById("s1-title").textContent = t.s1Title;
      document.getElementById("s1-body").textContent = t.s1Body;
      document.getElementById("meta-app-label").textContent = t.metaAppLabel;
      document.getElementById("meta-app-value").textContent = t.metaAppValue;
      document.getElementById("meta-dev-label").textContent = t.metaDevLabel;
      document.getElementById("meta-pkg-label").textContent = t.metaPkgLabel;

      document.getElementById("s2-title").textContent = t.s2Title;
      document.getElementById("s2-body1").textContent = t.s2Body1;
      document.getElementById("s2-body2").textContent = t.s2Body2;
      const listEl = document.getElementById("s2-list");
      listEl.innerHTML = "";
      t.s2List.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        listEl.appendChild(li);
      });

      document.getElementById("s3-title").textContent = t.s3Title;
      document.getElementById("s3-body1").textContent = t.s3Body1;
      document.getElementById("s3-body2").textContent = t.s3Body2;

      document.getElementById("s4-title").textContent = t.s4Title;
      document.getElementById("s4-body1").textContent = t.s4Body1;
      document.getElementById("s4-body2").textContent = t.s4Body2;

      document.getElementById("s5-title").textContent = t.s5Title;
      document.getElementById("s5-body").textContent = t.s5Body;
      document.getElementById("s5-repo-label").textContent = t.s5RepoLabel;
      document.getElementById("footer-text").textContent = t.footerText;

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
      });
    }

    (function initLang() {
      const browserLang = (navigator.language || "pt").toLowerCase();
      if (browserLang.startsWith("es")) setLang("es");
      else if (browserLang.startsWith("en")) setLang("en");
      else setLang("pt");
    })();
  </script>
</body>
</html>
